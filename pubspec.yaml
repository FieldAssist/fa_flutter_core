name: fa_flutter_core
description: Official FA Flutter core package.
version: 2.0.2
homepage: https://github.com/FieldAssist/fa_flutter_core.git

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter

  flutter_keyboard_visibility: ^7.0.1

  # Preferences
  shared_preferences: ^2.5.6

  # FA dart core
  fa_dart_core:
    git:
      url: https://github.com/FieldAssist/fa_dart_core.git
      ref: new/3.47

  # Model Utilities
  freezed_annotation: ^3.1.0
  # Floor kept at 4.9: apps that use realm directly (GT, FA One, db_utils) are capped at
  # json_serializable <6.11.3 by realm_generator, which needs json_annotation <4.10.
  json_annotation: ^4.9.0

  # Device Utilities
  in_app_update: ^5.0.0
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2

  webview_flutter: ^4.14.1
  bot_toast: ^4.1.3
  cached_network_image: ^4.0.6
  camera: ^0.12.2
#  collection: ^1.19.1
  dartx: ^1.2.0
  equatable: ^2.1.0
  expressions: ^0.2.5+3
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  #  flutter_geocoder: ^0.2.2-nullsafety
  flutter_svg: ^2.3.2
  font_awesome_flutter: ^11.0.0
  geocoding: ^5.0.1
  geolocator: ^14.1.2
  get_it: ^9.3.0
  google_maps_flutter: ^2.19.0
  image_picker: ^1.2.4
  internet_connection_checker: ^3.0.1
  lottie: ^3.8.2
  path_provider: ^2.1.6
  recase: ^4.1.0
  screenshot: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  sembast: ^3.10.0
  sembast_web: ^2.4.6+1
  shimmer: ^4.0.0
  sizer: ^3.1.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  provider: ^6.1.5+1
  flutter_image_compress: ^2.5.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Model Utilities
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

